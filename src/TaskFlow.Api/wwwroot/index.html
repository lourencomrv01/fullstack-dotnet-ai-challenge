<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; padding: 2rem; max-width: 720px; }
    h1 { font-size: 1.25rem; margin: 0 0 1.5rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: .5rem .65rem; border: 1px solid #8884; border-radius: 6px; font: inherit; background: transparent; color: inherit; }
    button { padding: .5rem .85rem; border: 1px solid #8884; border-radius: 6px; font: inherit; cursor: pointer; background: transparent; color: inherit; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
    li { display: flex; align-items: center; gap: .75rem; padding: .65rem .8rem; border: 1px solid #8884; border-radius: 8px; }
    .title { flex: 1; }
    .badge { font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; border: 1px solid #8886; }
    .Done .title { text-decoration: line-through; opacity: .6; }
    #error { color: #c0392b; min-height: 1.2em; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>TaskFlow</h1>

  <form id="new-task">
    <input id="title" placeholder="Nova tarefa" required />
    <input id="assignee" placeholder="Responsável" style="max-width: 10rem" />
    <button type="submit">Adicionar</button>
  </form>

  <p id="error"></p>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById('list');
    const error = document.getElementById('error');
    const NEXT = { Todo: 'Doing', Doing: 'Done', Done: 'Doing' };
    const LABEL = { Todo: 'Iniciar', Doing: 'Concluir', Done: 'Reabrir' };

    async function load() {
      const tasks = await fetch('/api/tasks').then(r => r.json());
      list.innerHTML = '';
      for (const task of tasks) {
        const li = document.createElement('li');
        li.className = task.status;
        li.innerHTML = `
          <span class="badge">${task.status}</span>
          <span class="title">${task.title}</span>
          <span class="badge">${task.assignee ?? '—'}</span>`;
        const button = document.createElement('button');
        button.textContent = LABEL[task.status];
        // TODO (candidato): ligar este botão ao endpoint PATCH /api/tasks/{id}/status
        // e exibir a mensagem de erro da API em #error quando a transição for recusada.
        button.onclick = () => alert('Não implementado');
        li.append(button);
        list.append(li);
      }
    }

    document.getElementById('new-task').onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('title');
      const assignee = document.getElementById('assignee');
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title: title.value, assignee: assignee.value || null })
      });
      title.value = '';
      await load();
    };

    load();
  </script>
</body>
</html>
